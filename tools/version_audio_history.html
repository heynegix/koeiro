<!doctype html><html lang="ja"><meta charset="utf-8"><title>歴代変換音声比較</title>
<style>body{background:#101725;color:#eff4ff;font:16px system-ui;margin:0}main{max-width:1100px;margin:auto;padding:24px}h1{font-size:26px}.bar{position:sticky;top:0;background:#101725ee;padding:16px 0;z-index:1;display:flex;gap:10px;flex-wrap:wrap}select,input,button{font:inherit;background:#26334c;color:white;border:1px solid #587092;border-radius:6px;padding:9px}article{background:#1b273c;border:1px solid #354764;border-radius:12px;padding:18px;margin:14px 0}audio{width:100%;height:38px}small,.muted{color:#b8c8df}h2{font-size:19px;margin:5px 0}.badges{display:flex;gap:12px;flex-wrap:wrap;color:#83d5da;font-size:14px}.sub{display:grid;grid-template-columns:1fr 1fr;gap:12px}details{margin:10px 0}textarea{box-sizing:border-box;width:100%;color:white;background:#121c2e;border:1px solid #415373;padding:8px}label{display:block;margin-bottom:7px}a{color:#a6d5ff}button.marked{background:#316c6b}footer{margin:20px;color:#b8c8df}@media(max-width:650px){.sub{grid-template-columns:1fr}}</style>
<main><h1>歴代変換音声比較</h1><p>保存されている変換後音声をバージョン別にまとめました。同じ入力録音で絞ると、声の変化を比べやすくなります。</p><p class="muted">初期表示は主要な保存音声です。「全実験」でモデル候補や設定違いも表示します。音量合わせはDC除去＋一定倍率のみ。同じ入力録音でも切出し区間・長さが異なる実験を含みます。実機音声は先頭の待ち時間も残しています。</p>
<div class="bar"><select id="scope"><option value="major">主要な履歴</option><option value="all">全実験</option><option value="star">お気に入り</option></select><select id="version"><option value="">全バージョン</option></select><select id="source"><option value="">全入力</option></select><select id="volume"><option value="matched">音量を揃える</option><option value="original">保存原音</option></select><input id="search" placeholder="モデル名・Blind IDで検索"><button id="export">メモを保存</button></div><p id="count"></p><div id="cards"></div><footer id="foot"></footer></main>
<script>
const history=__HISTORY_DATA__;
const $=s=>document.getElementById(s),key='voice-version-history-v1';let ratings={};try{ratings=JSON.parse(localStorage.getItem(key)||'{}')}catch{}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
history.versions.forEach(v=>$('version').add(new Option(v,v)));
history.groups.forEach(g=>$('source').add(new Option(`${g.label} · ${g.count}件 · ${g.id.slice(0,6)}`,g.id)));
function audio(url){return `<audio controls preload="none" src="${esc(url)}"></audio>`}
function save(){try{localStorage.setItem(key,JSON.stringify(ratings))}catch{}}
function render(){document.querySelectorAll('audio').forEach(a=>a.pause());const scope=$('scope').value,v=$('version').value,s=$('source').value,q=$('search').value.toLowerCase();const rows=history.rows.filter(r=>(scope==='all'||(scope==='major'&&r.major)||(scope==='star'&&ratings[r.id]?.star))&&(!v||r.version===v)&&(!s||(r.source?.id||'unknown')===s)&&(!q||[r.label,r.version,r.blind_id,r.archive_path,r.note].join(' ').toLowerCase().includes(q)));$('count').textContent=`表示 ${rows.length}件 / 保存履歴 ${history.total}件（主要 ${history.major}件）`;
$('cards').innerHTML=rows.map(r=>`<article><div class="badges"><span>${esc(r.version)}</span><span>${r.duration.toFixed(2)}秒</span><span>${esc(r.blind_id||'')}</span></div><h2>${esc(r.label)}</h2><p class="muted">${esc(r.note)}<br>${esc(r.kind)}</p>${audio($('volume').value==='original'?r.original:r.audio)}<div class="sub">${r.source?`<details><summary>入力：${esc(r.source.label)} · SHA ${r.source.id.slice(0,8)}</summary>${audio(r.source.url)}</details>`:'<p>入力録音：不明</p>'}${r.reference?`<details><summary>Target / Reference</summary>${audio(r.reference.url)}</details>`:''}</div><details><summary>保存情報</summary><small>${esc(r.archive_path)}<br>${r.sample_rate}Hz / ${r.channels}ch · 比較用音量倍率 ${r.scalar_gain.toFixed(3)} · 保存音声のclipping ${r.raw_clipping_samples}<br>同じ音声SHAの履歴は複数カードでも音声ファイルを共用。</small></details><button class="${ratings[r.id]?.star?'marked':''}" data-star="${r.id}">${ratings[r.id]?.star?'★ お気に入り':'☆ お気に入り'}</button><label>聴取メモ</label><textarea rows="2" data-note="${r.id}" placeholder="似具合・自然さ・感想">${esc(ratings[r.id]?.note||'')}</textarea></article>`).join('');
document.querySelectorAll('[data-star]').forEach(b=>b.onclick=()=>{const id=b.dataset.star;ratings[id]??={};ratings[id].star=!ratings[id].star;save();render()});document.querySelectorAll('[data-note]').forEach(t=>t.oninput=()=>{ratings[t.dataset.note]??={};ratings[t.dataset.note].note=t.value;save()});}
['scope','version','source','volume'].forEach(id=>$(id).onchange=render);$('search').oninput=render;
document.addEventListener('play',e=>{if(e.target.tagName==='AUDIO')document.querySelectorAll('audio').forEach(a=>{if(a!==e.target)a.pause()})},true);
$('export').onclick=()=>{const data={schema:1,created:new Date().toISOString(),ratings,candidates:history.rows.map(r=>({id:r.id,version:r.version,label:r.label,archive_path:r.archive_path,output_sha256:r.output_sha256}))};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='voice-version-history-ratings.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$('foot').textContent=`保存音声未確認のバージョン：${history.missing_versions.join(' / ')}。モデル候補・設定実験も含みます。入力不明同士を同じSourceとは判定しません。読込不可 ${history.failures.length}件（記録はmanifestに保存）。`;render();
</script></html>
