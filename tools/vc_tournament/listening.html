<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>v0.11 Blind Voice Comparison</title>
<style>body{font-family:system-ui;margin:auto;max-width:1000px;padding:24px;background:#111722;color:#e5edf7}h1{font-size:26px}article{background:#1c2636;border:1px solid #39465b;border-radius:12px;padding:18px;margin:18px 0}audio{max-width:100%;height:40px}label{display:inline-block;margin:8px 16px 8px 0}select,button,textarea{font:inherit;background:#25364a;color:#fff;border:1px solid #668098;border-radius:5px;padding:6px}button{cursor:pointer;margin:6px}small{color:#b6c8dc}.players{display:flex;flex-wrap:wrap;gap:16px}.player{min-width:220px}textarea{display:block;width:90%;margin-top:12px}#status{color:#b1dfc6}</style>
<h1>v0.11 Blind Voice Comparison</h1>
<p>優先順位：Targetへの類似 → 自然さ → 元声の少なさ → 女声らしさ → 機械感の少なさ。速度は別評価です。</p>
<p><small>類似・自然さ・女声らしさ：5が高い。元声残り・機械感：5が多い（悪い）。未評価は空欄。モデル対応表は別フォルダです。</small></p>
<button id="export">評価JSONを保存</button><label>保存済み評価を読み込む <input id="import" type="file" accept="application/json"></label><span id="status"></span>
<p><small>評価JSONの保存先はDドライブを選んでください。評価はブラウザにも自動保存されます。</small></p>
<main id="candidates"></main>
<script>
const data=__DATA__,key='v011-ratings-'+data.package;
let ratings={};try{const saved=JSON.parse(localStorage.getItem(key)||'{}');if(saved&&typeof saved==='object'&&!Array.isArray(saved))ratings=saved}catch(e){}
const metrics=[['similarity','Targetへの似具合'],['naturalness','自然さ'],['femininity','女声らしさ'],['source_residue','元声残り'],['mechanical','機械感']];
function save(){try{localStorage.setItem(key,JSON.stringify(ratings));document.getElementById('status').textContent='ブラウザに保存済み（JSONの書き出しも推奨）'}catch(e){document.getElementById('status').textContent='ブラウザ保存が利用できません。JSONを保存してください。'}}
function render(){const root=document.getElementById('candidates');root.replaceChildren();
if(!data.candidates.length){root.textContent='SOURCE / MODEL PREPARATION PENDING — Blind候補はまだ生成されていません。人間聴取待ちの完成状態ではありません。';return;}
for(const c of data.candidates){const article=document.createElement('article');const title=document.createElement('h2');title.textContent=c.id;article.append(title);const players=document.createElement('div');players.className='players';
for(const [label,url] of [['Candidate',c.audio],['Target Reference',c.reference],['Source',c.source]]){const d=document.createElement('div');d.className='player';const p=document.createElement('p');p.textContent=label;const a=document.createElement('audio');a.controls=true;a.preload='none';a.src=url;d.append(p,a);players.append(d)}article.append(players);
for(const [field,title] of [...metrics,['decision','判定']]){const l=document.createElement('label');l.textContent=title+' ';const s=document.createElement('select');for(const val of (field==='decision'?['','Keep','Maybe','Reject']:['','1','2','3','4','5'])){const o=document.createElement('option');o.value=val;o.textContent=val||'未評価';s.append(o)}s.value=ratings[c.id]?.[field]||'';s.onchange=()=>{ratings[c.id]??={};ratings[c.id][field]=s.value;save()};l.append(s);article.append(l)}
const t=document.createElement('textarea');t.placeholder='コメント';t.value=ratings[c.id]?.comment||'';t.oninput=()=>{ratings[c.id]??={};ratings[c.id].comment=t.value;save()};article.append(t);root.append(article)}}
document.getElementById('export').onclick=async()=>{const value={schema:1,package:data.package,exported_at:new Date().toISOString(),ratings};const blob=new Blob([JSON.stringify(value,null,2)],{type:'application/json'});try{if(window.showSaveFilePicker){const file=await window.showSaveFilePicker({id:'v011-ratings',suggestedName:'v011-ratings.json',types:[{description:'評価JSON',accept:{'application/json':['.json']}}]});const writer=await file.createWritable();await writer.write(blob);await writer.close();document.getElementById('status').textContent='評価JSONを保存しました';return}const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='v011-ratings.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}catch(err){document.getElementById('status').textContent=err.name==='AbortError'?'保存を中止しました。評価はブラウザに残っています。':err.message}};
document.getElementById('import').onchange=async e=>{try{const v=JSON.parse(await e.target.files[0].text());if(v.package!==data.package)throw Error('別のBlind packageの評価です');if(!v.ratings||typeof v.ratings!=='object'||Array.isArray(v.ratings))throw Error('評価JSONの形式が不正です');const ids=new Set(data.candidates.map(c=>c.id));for(const [id,row] of Object.entries(v.ratings)){if(!ids.has(id))throw Error('不明なCandidate');if(!row||typeof row!=='object'||Array.isArray(row))throw Error('評価の形式が不正です');for(const [m] of metrics)if(row[m]&&!['1','2','3','4','5'].includes(String(row[m])))throw Error('評価は1〜5');if(row.decision&&!['Keep','Maybe','Reject'].includes(row.decision))throw Error('不正な判定')}ratings=v.ratings;save();render()}catch(err){document.getElementById('status').textContent=err.message}};
render();
</script></html>
